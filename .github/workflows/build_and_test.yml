name: Build And Test

on:
  push:
  pull_request:

env:
  UV_VERSION: 0.8.6

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"

    steps:
    - uses: actions/checkout@v5

    - name: Install uv
      uses: astral-sh/setup-uv@v6
      with:
        version: ${{ env.UV_VERSION }}
        python-version: ${{ matrix.python-version }}

    - name: Install the project
      run: uv sync --locked --dev --no-cache

    - name: PyTest (macOS exclude m tests)
      if: matrix.os == 'macos-latest'
      run: uv run pytest -k 'not test_py_action_m'

    - name: PyTest (Ubuntu full)
      if: matrix.os == 'ubuntu-latest'
      run: uv run pytest

    - name: Run Subprocess STSP
      if: always()
      run: PYTHONFAULTHANDLER=1 uv run stsp_bin sample-l.in
      working-directory: ./sample
